name = "ninelink-reporter"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
REPORTS_REPO = "czlttmsl/NineLink-reports"

# 5 reports per minute per IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secret (not in this file):  npx wrangler secret put GITHUB_TOKEN
#   fine-grained token, repository access: only NineLink-reports, permission Issues: Read and write
